name: Build APK
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk GlassLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: GlassLauncher.apk

      # Push a tag like v2.0 -> GitHub release + update.json for the launcher's web update
      - name: Make update.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "{\"versionCode\": $CODE, \"versionName\": \"$NAME\", \"apk\": \"https://github.com/${{ github.repository }}/releases/latest/download/GlassLauncher.apk\", \"notes\": \"\"}" > update.json
          cat update.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            GlassLauncher.apk
            update.json
